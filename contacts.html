<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <!-- Стили Bootstrap из удаленного CDN-репозитория -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Иконки Bootstrap из удаленного CDN-репозитория -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-white">

    <div class="d-flex min-vh-100">
        <!-- Левый темный сайдбар -->
        <aside class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 250px;">
            <a href="/" class="d-flex align-items-center mb-3 text-white text-decoration-none">
                <span class="badge bg-light text-dark fs-6 me-2">В</span>
                <span class="fs-5 fw-semibold">Меню</span>
            </a>
            <hr class="border-secondary">

            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/" class="nav-link text-white-50">
                        <i class="bi bi-house-door me-2"></i> Главная
                    </a>
                </li>
                <li>
                    <a href="/catalog" class="nav-link text-white-50">
                        <i class="bi bi-folder me-2"></i> Категории
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-white-50">
                        <i class="bi bi-grid-3x3-gap me-2"></i> Заказы
                    </a>
                </li>
                <li>
                    <a href="/contacts" class="nav-link active text-white" aria-current="page">
                        <i class="bi bi-person me-2"></i> Контакты
                    </a>
                </li>
            </ul>

            <hr class="border-secondary">

            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="rounded-circle bg-secondary d-inline-block me-2" style="width: 32px; height: 32px;"></span>
                    <strong>Пользователь</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser">
                    <li><a class="dropdown-item" href="#">Профиль</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#">Выход</a></li>
                </ul>
            </div>
        </aside>

        <!-- Основная область страницы с формой и контактами -->
        <main class="flex-grow-1 p-5">
            <h1 class="text-center mb-5 fw-normal">Контакты</h1>

            <div class="container" style="max-width: 900px;">
                <div class="row g-5">
                    <!-- Форма заявки -->
                    <div class="col-md-6">
                        <div class="card p-4 shadow-sm border rounded-3">
                            <form action="#" method="post">
                                <div class="mb-3">
                                    <label for="name" class="form-label small fw-semibold text-secondary">Имя</label>
                                    <input type="text" class="form-control" id="name" placeholder="">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label small fw-semibold text-secondary">Почта</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted">@</span>
                                        <input type="email" class="form-control" id="email" placeholder="">
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="message" class="form-label small fw-semibold text-secondary">Сообщение</label>
                                    <textarea class="form-control" id="message" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary px-4">Отправить</button>
                            </form>
                        </div>
                    </div>

                    <!-- Текстовое описание контактов -->
                    <div class="col-md-6">
                        <h4 class="fw-bold mb-3">Наши контакты</h4>
                        <p class="text-secondary small">
                            Здесь вы можете оставить запрос или связаться с нашей службой поддержки. Мы всегда открыты для предложений и оперативно отвечаем на обращения пользователей.
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS из удаленного CDN-репозитория -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
